services:
  # ── Backend Web Service ──────────────────────────────────────────
  - type: web
    name: scopesentinel-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scopesentinel-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS_RAW
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9

  # ── Frontend Static Site ─────────────────────────────────────────
  - type: web
    name: scopesentinel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://scopesentinel-backend.onrender.com

# ── Managed PostgreSQL Database ──────────────────────────────────
databases:
  - name: scopesentinel-db
    databaseName: scopesentinel
    user: scopeuser
    plan: free
