<svg width="100%" height="200" viewBox="0 0 1500 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A11CB">
        <animate attributeName="stop-color"
                 values="#6A11CB;#9D50BB;#B266FF;#9D50BB;#6A11CB"
                 dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#B266FF">
        <animate attributeName="stop-color"
                 values="#B266FF;#6A11CB;#9D50BB;#6A11CB;#B266FF"
                 dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1500" height="200" fill="url(#headerBg)" />

  <!-- scrolling wave layer (two copies tiled so the translate loop is seamless) -->
  <g fill="#ffffff" opacity="0.10">
    <path d="M0,150 C125,110 250,190 375,150 C500,110 625,190 750,150
             C875,110 1000,190 1125,150 C1250,110 1375,190 1500,150 L1500,200 L0,200 Z" />
    <path d="M1500,150 C1625,110 1750,190 1875,150 C2000,110 2125,190 2250,150
             C2375,110 2500,190 2625,150 C2750,110 2875,190 3000,150 L3000,200 L1500,200 Z" />
    <animateTransform attributeName="transform" type="translate"
                       values="0,0; -1500,0; 0,0" dur="14s" repeatCount="indefinite" />
  </g>

  <g fill="#ffffff" opacity="0.06">
    <path d="M0,165 C150,135 300,195 450,165 C600,135 750,195 900,165
             C1050,135 1200,195 1350,165 C1500,135 1650,195 1800,165 L1800,200 L0,200 Z" />
    <path d="M1800,165 C1950,135 2100,195 2250,165 C2400,135 2550,195 2700,165
             C2850,135 3000,195 3150,165 C3300,135 3450,195 3600,165 L3600,200 L1800,200 Z" />
    <animateTransform attributeName="transform" type="translate"
                       values="0,0; -1800,0; 0,0" dur="20s" repeatCount="indefinite" />
  </g>

  <!-- twinkling stars -->
  <circle cx="90"   cy="35"  r="1.6" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="0s"   repeatCount="indefinite" /></circle>
  <circle cx="240"  cy="60"  r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.4s" repeatCount="indefinite" /></circle>
  <circle cx="410"  cy="30"  r="1.8" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="0.9s" repeatCount="indefinite" /></circle>
  <circle cx="560"  cy="55"  r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.3s" repeatCount="indefinite" /></circle>
  <circle cx="1000" cy="40"  r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.6s" repeatCount="indefinite" /></circle>
  <circle cx="1120" cy="65"  r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.1s" repeatCount="indefinite" /></circle>
  <circle cx="1290" cy="35"  r="1.7" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="2.0s" begin="0.2s" repeatCount="indefinite" /></circle>
  <circle cx="1420" cy="58"  r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.6s" repeatCount="indefinite" /></circle>

  <!-- title -->
  <text x="750" y="120" font-family="'Fira Code', 'Courier New', monospace" font-size="55"
        font-weight="600" fill="#ffffff" text-anchor="middle">
    ScopeSentinel
    <animate attributeName="opacity" values="0.82;1;0.82" dur="3.4s" repeatCount="indefinite" />
  </text>
</svg>