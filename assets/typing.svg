<svg width="100%" height="34" viewBox="0 0 780 34" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip0"><rect x="0" y="0" width="0" height="34">
      <animate attributeName="width" values="0;0;560;560" keyTimes="0;0;0.125;1"
                dur="16s" repeatCount="indefinite" />
    </rect></clipPath>
    <clipPath id="clip1"><rect x="0" y="0" width="0" height="34">
      <animate attributeName="width" values="0;0;560;560" keyTimes="0;0.25;0.375;1"
                dur="16s" repeatCount="indefinite" />
    </rect></clipPath>
    <clipPath id="clip2"><rect x="0" y="0" width="0" height="34">
      <animate attributeName="width" values="0;0;520;520" keyTimes="0;0.5;0.625;1"
                dur="16s" repeatCount="indefinite" />
    </rect></clipPath>
    <clipPath id="clip3"><rect x="0" y="0" width="0" height="34">
      <animate attributeName="width" values="0;0;620;620" keyTimes="0;0.75;0.875;1"
                dur="16s" repeatCount="indefinite" />
    </rect></clipPath>
  </defs>

  <g font-family="'Fira Code', 'Courier New', monospace" font-size="20" font-weight="600" fill="#B266FF">

    <g clip-path="url(#clip0)">
      <text x="0" y="24">8 Autonomous AI Agents • LangGraph Pipelines</text>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.218;0.219;1"
                dur="16s" repeatCount="indefinite" />
    </g>

    <g clip-path="url(#clip1)">
      <text x="0" y="24">Real-time Requirement ↔ Code Drift Detection</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.251;0.469;0.47;1"
                dur="16s" repeatCount="indefinite" />
    </g>

    <g clip-path="url(#clip2)">
      <text x="0" y="24">FastAPI + React + Qdrant + Neo4j + MongoDB</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.501;0.719;0.72;1"
                dur="16s" repeatCount="indefinite" />
    </g>

    <g clip-path="url(#clip3)">
      <text x="0" y="24">Built for Engineering Teams Who Hate Scope Creep</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.751;0.969;0.97;1"
                dur="16s" repeatCount="indefinite" />
    </g>

    <!-- blinking cursor -->
    <rect x="0" y="4" width="2.5" height="22" fill="#B266FF">
      <animate attributeName="x" values="0;560;0;560;0;520;0;620;0" keyTimes="0;0.218;0.25;0.469;0.5;0.719;0.75;0.969;1"
                dur="16s" repeatCount="indefinite" calcMode="discrete" />
      <animate attributeName="opacity" values="1;0" dur="0.6s" repeatCount="indefinite" />
    </rect>

  </g>
</svg>